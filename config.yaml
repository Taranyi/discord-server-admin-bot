schema_version: 1

course_template:
  category:
    name: "{semester} · {course_name}"

  channels:
    course_chat:
      type: text
      name: course-chat
      topic: "General discussion for {course_name}."

    discussions:
      type: forum
      name: discussions
      topic: "Structured discussions for {course_name}."
      tags:
        - Question
        - Resource
        - Assignment
        - Exam
        - Notes
        - Code
        - Project
        - Idea
        - Important
        - Other

    study_room:
      type: voice
      name: study-room
